[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-first-aid"
version = "0.1.0"
description = "Bilingual, practical first-aid checks for GitHub repositories"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Repo First Aid contributors" }]

[project.scripts]
repo-first-aid = "repo_first_aid.cli:main"

[tool.setuptools.packages.find]
include = ["repo_first_aid*"]
